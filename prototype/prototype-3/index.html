{id:'d1',title:'D1 database',url:'https://developers.cloudflare.com/d1/',platform:'Website',date:'2026-10-15',category:'Tools',usage:'active',status:'collection',content:'SQLite database serverless untuk Cloudflare Workers.'}
];
let categories=readCategories();
let items=readItems(),mode='folder',location={kind:'collection'},query='',collectionView='folders',collectionLayout='standard',collectionTab='all',filters={platform:'',category:'',days:''},toastTimer,lastTrigger=null;
const $=s=>document.querySelector(s),heading=$('#heading'),content=$('#content'),menu=$('#brand-menu'),filterPop=$('#filter-pop'),detail=$('#detail-dialog'),add=$('#add-dialog');
function readItems(){try{const v=localStorage.getItem('devpocket-prototype-3');return v?JSON.parse(v):seed.map(x=>({...x}))}catch{return seed.map(x=>({...x}))}}
function save(){try{localStorage.setItem('devpocket-prototype-3',JSON.stringify(items))}catch{notify('Tersimpan selama tab ini terbuka')}}
function readCategories(){try{const v=localStorage.getItem('devpocket-prototype-3-categories');return v?JSON.parse(v):['Tools','Konsep','Library','Project Open Source']}catch{return ['Tools','Konsep','Library','Project Open Source']}}
function saveCategories(){try{localStorage.setItem('devpocket-prototype-3-categories',JSON.stringify(categories))}catch{notify('Kategori tersimpan selama tab ini terbuka')}}
function fillCategorySelects(){const f=document.getElementById('f-category'),prev=f.value;f.innerHTML='<option value="">Semua kategori</option>'+categories.map(c=>'<option>'+esc(c)+'</option>').join('');f.value=prev;document.getElementById('new-category').innerHTML='<option value="">Pilih kategori</option>'+categories.map(c=>'<option>'+esc(c)+'</option>').join('')+'<option value="__new__">Tambah kategori...</option>'}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(n){return `<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`}
function usageName(v){return({try:'Ingin dicoba',active:'Aktif digunakan',reference:'Referensi'})[v]||''}
function color(p){return({Instagram:'#b64c72',Threads:'#393730',Facebook:'#3b66b0',GitHub:'#6b6678',Website:'#558067'})[p]||'#8b8679'}
function matches(i){const hay=[i.title,i.content,i.url,i.category,i.platform].join(' ').toLowerCase();if(query.trim()&&!hay.includes(query.trim().toLowerCase()))return false;if(filters.platform&&i.platform!==filters.platform)return false;if(filters.category&&i.category!==filters.category)return false;if(filters.days){const age=(new Date('2026-10-31')-new Date(i.date))/(86400000);if(age>Number(filters.days))return false}return true}
function found(){return items.filter(matches)}
function setHeading(title,crumbs=[],count=found().length,extra=''){const nav=crumbs.length?`<nav class="crumbs" aria-label="Lokasi">${crumbs.map((c,i)=>`${i?'<span aria-hidden="true">/</span>':''}${c.action?`<button type="button" data-crumb="${esc(c.action)}">${esc(c.label)}</button>`:`<span>${esc(c.label)}</span>`}`).join('')}</nav>`:'';heading.innerHTML=`<div>${nav}<div class="title-row">${extra}<h1 class="title">${esc(title)}</h1></div></div><span class="count">${count} item</span>`}
function folderCard(title,count,dest){return `<button type="button" class="folder-card" data-folder="${esc(dest)}" aria-label="${esc(title)}, ${count} item"><span class="folder-symbol">${icon('folder')}</span><span class="folder-title">${esc(title)}</span><span class="folder-count">${count} item</span></button>`}
function itemCard(i,showLocation=false){const date=new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short'}).format(new Date(i.date+'T12:00:00'));const place=showLocation?`<span class="collection-location">${icon('folder')}<span>${esc(i.status==='draft'?'Draft':(i.category||'Koleksi'))}</span></span>`:(i.category?`<span class="collection-name">${esc(i.category)}</span>`:'');return `<button type="button" class="item-card" data-item="${esc(i.id)}" aria-label="Buka ${esc(i.title)}"><span class="item-meta"><i class="platform-dot" style="background:${color(i.platform)}"></i>${esc(i.platform)}<span aria-hidden="true">·</span>${date}</span><span class="item-title">${esc(i.title)}</span>${place}${i.content?`<span class="snippet">${esc(i.content.replace(/\n/g,' '))}</span>`:''}<span class="item-footer">${i.usage?`<span class="tag ${i.usage==='active'?'active':''}">${esc(usageName(i.usage))}</span>`:''}</span></button>`}
function compareRow(i){const date=new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short'}).format(new Date(i.date+'T12:00:00'));const place=i.status==='draft'?'Draft':(i.category||'Koleksi');return `<button type="button" class="list-card" data-item="${esc(i.id)}"><span class="list-meta"><i class="platform-dot" style="background:${color(i.platform)}"></i>${esc(i.platform)} · ${date}</span><span class="list-title">${esc(i.title)}</span><span class="collection-location">${icon('folder')}<span>${esc(place)}</span></span></button>`}
function empty(msg){return `<div class="empty"><strong>${esc(msg)}</strong></div>`}
function render(){
$('#filter-dot').hidden=!Object.values(filters).some(Boolean);$('#folder-view').setAttribute('aria-pressed',String(mode==='folder'));$('#item-view').setAttribute('aria-pressed',String(mode==='item'));$('.mode').hidden=location.kind!=='root';$('#clear-search').hidden=!query;
let html='',all=found();
if(query.trim()){setHeading('Hasil pencarian',[],all.length);html=all.length?`<div class="grid">${all.map(itemCard).join('')}</div>`:empty('Tidak ada yang cocok')}
else if(location.kind==='root'&&mode==='folder'){const drafts=all.filter(x=>x.status==='draft').length,collection=all.filter(x=>x.status==='collection').length;setHeading('Folder',[],drafts+collection);html=`<div class="grid">${folderCard('Draft',drafts,'draft')}${folderCard('Koleksi',collection,'collection')}</div>`}
else if(location.kind==='root'){setHeading('Semua item',[],all.length);html=all.length?`<div class="grid">${all.map(itemCard).join('')}</div>`:empty('Belum ada catatan')}
else if(location.kind==='draft'){const rows=all.filter(x=>x.status==='draft');setHeading('Draft',[{label:'Koleksi',action:'collection'},{label:'Draft'}],rows.length);html=rows.length?`<div class="grid">${rows.map(itemCard).join('')}</div>`:empty('Belum ada draft')}
else if(location.kind==='collection'){
const collectionRows=all.filter(x=>x.status==='collection'),rows=all.filter(x=>x.status==='collection'||x.status==='draft'),drafts=all.filter(x=>x.status==='draft');
const extra=`<button class="square collection-one" type="button" data-collection-toggle aria-label="${collectionView==='folders'?'Tampilkan item':'Kembali ke folder'}" title="${collectionView==='folders'?'Tampilkan item':'Kembali ke folder'}">${icon(collectionView==='folders'?'grid':'folder')}</button>`;
setHeading('Koleksi',[],rows.length,extra);
if(collectionView==='folders'){const cats=categories.map(name=>({name,count:collectionRows.filter(x=>x.category===name).length})).filter(x=>x.count);html=`<div class="grid">${folderCard('Draft',drafts.length,'draft')}${cats.map(x=>folderCard(x.name,x.count,'category:'+x.name)).join('')}</div>`}
else{const layoutChoices=`<div class="layout-choices" role="group" aria-label="Tampilan item"><button class="layout-choice ${collectionLayout==='standard'?'active':''}" type="button" data-layout-choice="standard" aria-pressed="${collectionLayout==='standard'}">${icon('list')}<span>Standard</span></button><button class="layout-choice ${collectionLayout==='compare'?'active':''}" type="button" data-layout-choice="compare" aria-pressed="${collectionLayout==='compare'}">${icon('columns')}<span>Compare</span></button></div>`;const states=[{key:'all',label:'Semua'},{key:'try',label:'Ingin dicoba'},{key:'active',label:'Aktif digunakan'},{key:'reference',label:'Referensi'},{key:'draft',label:'Draft'}];
if(collectionLayout==='standard'){const tabs=`<div class="status-tabs" role="group" aria-label="Status item">${states.map(x=>`<button type="button" class="status-tab" data-tab="${x.key}" aria-pressed="${collectionTab===x.key}">${x.label}</button>`).join('')}</div>`;const entries=rows.filter(x=>collectionTab==='all'||(collectionTab==='draft'?x.status==='draft':x.status==='collection'&&x.usage===collectionTab));html=layoutChoices+tabs+(entries.length?`<div class="grid">${entries.map(i=>itemCard(i,true)).join('')}</div>`:empty('Belum ada catatan'))}
else{const groups=[{key:'active',label:'Aktif digunakan'},{key:'try',label:'Ingin dicoba'},{key:'reference',label:'Referensi'},{key:'draft',label:'Draft'}];html=layoutChoices+`<div class="compare-grid">${groups.map(g=>{const entries=rows.filter(x=>g.key==='draft'?x.status==='draft':x.status==='collection'&&x.usage===g.key);return `<section class="compare-column"><div class="compare-column-head"><h2>${g.label}</h2><span class="count">${entries.length}</span></div><div class="compare-list">${entries.length?entries.map(compareRow).join(''):''}</div></section>`}).join('')}</div>`}}
}
else{const rows=all.filter(x=>x.category===location.name&&x.status==='collection');setHeading(location.name,[{label:'Koleksi',action:'collection'},{label:location.name}],rows.length);html=rows.length?`<div class="grid">${rows.map(i=>itemCard(i)).join('')}</div>`:empty('Belum ada catatan')}
content.innerHTML=html;
}
function hideMenu(){menu.hidden=true;$('#brand-button').setAttribute('aria-expanded','false')}
function hideFilters(){filterPop.hidden=true;$('#filter-button').setAttribute('aria-expanded','false')}
function notify(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2200)}
function go(dest){if(dest==='items'){mode='folder';location={kind:'collection'};collectionView='items';collectionLayout='standard';collectionTab='all'}else{mode='folder';location={kind:dest};if(dest==='collection')collectionView='folders'}query='';$('#search-input').value='';hideMenu();render()}
function openDetail(id,trigger){const i=items.find(x=>x.id===id);if(!i)return;lastTrigger=trigger;$('#detail-title').textContent=i.title;const text=esc(i.content||'Catatan ini masih kosong.').split('\n\n').map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');const date=new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'long',year:'numeric'}).format(new Date(i.date+'T12:00:00'));$('#detail-body').innerHTML=`<div class="detail-meta"><span>${esc(i.platform)}</span><span>·</span><span>Ditambahkan ${date}</span>${i.category?`<span>·</span><span>${esc(i.category)}</span>`:''}${i.usage?`<span class="tag ${i.usage==='active'?'active':''}">${esc(usageName(i.usage))}</span>`:''}</div><div class="detail-text">${text}</div>${i.url?`<a class="source-link" href="${esc(i.url)}" target="_blank" rel="noreferrer">Buka sumber ↗</a>`:''}<div class="dialog-actions"><button type="button" class="btn" data-close="detail-dialog">Tutup</button></div>`;detail.showModal()}
function openAdd(){lastTrigger=$('#add-button');$('#add-form').reset();$('#form-error').hidden=true;fillCategorySelects();add.showModal();setTimeout(()=>$('#new-title').focus(),0)}
function applyFilters(){filters={platform:$('#f-platform').value,category:$('#f-category').value,days:$('#f-date').value};hideFilters();render()}
$('#brand-button').addEventListener('click',()=>{const open=menu.hidden;menu.hidden=!open;$('#brand-button').setAttribute('aria-expanded',String(open));if(open)menu.querySelector('button').focus()});menu.addEventListener('click',e=>{const b=e.target.closest('[data-dest]');if(b)go(b.dataset.dest)});
$('#filter-button').addEventListener('click',()=>{const open=filterPop.hidden;filterPop.hidden=!open;$('#filter-button').setAttribute('aria-expanded',String(open))});$('#apply-filters').addEventListener('click',applyFilters);
$('#clear-filters').addEventListener('click',()=>{$('#f-platform').value='';$('#f-category').value='';$('#f-date').value='';filters={platform:'',category:'',days:''};hideFilters();render()});
$('#folder-view').addEventListener('click',()=>{mode='folder';if(location.kind==='category')location={kind:'collection'};render()});$('#item-view').addEventListener('click',()=>{mode='item';render()});$('#search-input').addEventListener('input',e=>{query=e.target.value;render()});$('#clear-search').addEventListener('click',()=>{$('#search-input').value='';query='';render();$('#search-input').focus()});
heading.addEventListener('click',e=>{const toggle=e.target.closest('[data-collection-toggle]');if(toggle){collectionView=collectionView==='folders'?'items':'folders';render();return}const c=e.target.closest('[data-crumb]');if(c){location={kind:c.dataset.crumb};if(location.kind==='collection'){mode='folder';collectionView='folders'}render()}});content.addEventListener('click',e=>{const layout=e.target.closest('[data-layout-choice]');if(layout){collectionLayout=layout.dataset.layoutChoice;collectionView='items';render();return}const tab=e.target.closest('[data-tab]');if(tab){collectionTab=tab.dataset.tab;render();return}const f=e.target.closest('[data-folder]');if(f){const d=f.dataset.folder;location=d.startsWith('category:')?{kind:'category',name:d.slice(9)}:{kind:d};if(location.kind==='collection'){mode='folder';collectionView='folders'}render();return}const card=e.target.closest('[data-item]');if(card)openDetail(card.dataset.item,card)});
$('#add-button').addEventListener('click',openAdd);$('#add-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),dest=f.get('destination'),title=String(f.get('title')||'').trim(),url=String(f.get('url')||'').trim(),category=String(f.get('category')||''),usage=String(f.get('usage')||'');const err=$('#form-error');if(url&&!/^https?:\/\//i.test(url)){err.textContent='Link harus diawali http:// atau https://.';err.hidden=false;return}if(dest==='collection'&&!category){err.textContent='Pilih kategori untuk Koleksi.';err.hidden=false;return}if(dest==='collection'&&!usage){err.textContent='Pilih status penggunaan untuk Koleksi.';err.hidden=false;return}const platform=url?((/instagram\.com/i.test(url)&&'Instagram')||(/threads\.net/i.test(url)&&'Threads')||(/facebook\.com/i.test(url)&&'Facebook')||(/github\.com/i.test(url)&&'GitHub')||'Website'):'Website';items.unshift({id:'new-'+Date.now(),title,url,platform,date:'2026-10-31',category:dest==='collection'?category:'',usage:dest==='collection'?usage:'',status:dest==='collection'?'collection':'draft',content:String(f.get('content')||'').trim()});save();add.close();mode='folder';location=dest==='draft'?{kind:'draft'}:{kind:'category',name:category};render();notify('Tersimpan')});
document.addEventListener('click',e=>{if(!e.target.closest('.brand-wrap'))hideMenu();if(!e.target.closest('.filter-wrap'))hideFilters();const b=e.target.closest('[data-close]');if(b){const d=document.getElementById(b.dataset.close);if(d?.open)d.close()}});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('search-input').focus()}if(e.key==='Escape'){if(!menu.hidden){hideMenu();document.getElementById('brand-button').focus()}if(!filterPop.hidden){hideFilters();document.getElementById('filter-button').focus()}}});for(const d of[detail,add])d.addEventListener('close',()=>{if(lastTrigger?.isConnected)lastTrigger.focus()});
fillCategorySelects();document.getElementById('new-category').addEventListener('change',()=>{const sel=document.getElementById('new-category');if(sel.value!=='__new__')return;const name=prompt('Nama kategori');if(name&&name.trim()){const clean=name.trim();if(!categories.some(c=>c.toLowerCase()===clean.toLowerCase())){categories.push(clean);saveCategories()}fillCategorySelects();sel.value=clean}else sel.value=''});render();
})();
</script></body></html>
